name: Sicada Frontend Verification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'public/**'
      - '.github/workflows/frontend-verify.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.html
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
